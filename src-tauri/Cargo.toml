[package]
name = "velvetdesk"
version = "0.2.0"
description = "VelvetDesk AI — cross-platform agency copilot"
authors = ["VelvetDesk AI contributors"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "velvetdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vd-llm.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
chrono.workspace = true
uuid.workspace = true
parking_lot.workspace = true
log.workspace = true
base64.workspace = true
futures-util.workspace = true

# Turning the webview's own autofill off needs its settings interface.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }

# Updating in place is a desktop affair: a phone installs its own APK.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

tauri-plugin-single-instance = "2"
