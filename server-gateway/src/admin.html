<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VelvetDesk — шлюз</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0b0f;
        --surface: #111319;
        --surface-2: #161922;
        --elev: #1b1f2a;
        --hover: #1f2430;
        --line: rgb(255 255 255 / 0.07);
        --line-2: rgb(255 255 255 / 0.12);
        --text: #eceef4;
        --dim: #9199a9;
        --faint: #636b7c;
        --accent: #a979ff;
        --accent-2: #ff6fb5;
        --accent-soft: rgb(169 121 255 / 0.14);
        --ok: #34d399;
        --ok-soft: rgb(52 211 153 / 0.13);
        --warn: #fbbf24;
        --warn-soft: rgb(251 191 36 / 0.13);
        --bad: #fb6f7e;
        --bad-soft: rgb(251 111 126 / 0.13);
        --info: #60a5fa;
        --info-soft: rgb(96 165 250 / 0.13);
        --r-lg: 18px;
        --r-md: 13px;
        --r-sm: 10px;
        --shadow: 0 1px 0 rgb(255 255 255 / 0.04) inset, 0 12px 32px -18px rgb(0 0 0 / 0.7);
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        font-feature-settings: "cv11", "ss01";
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(700px 380px at 12% -8%, rgb(169 121 255 / 0.13), transparent 70%),
          radial-gradient(600px 360px at 100% 0%, rgb(255 111 181 / 0.07), transparent 70%);
        z-index: 0;
      }
      button, input, select { font: inherit; color: inherit; }
      ::selection { background: rgb(169 121 255 / 0.35); }
      .mono { font-family: var(--mono); font-size: 12.5px; }
      .dim { color: var(--dim); }
      .faint { color: var(--faint); }
      .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      .num { font-variant-numeric: tabular-nums; }

      /* ---------------------------------------------------------------- layout */
      .app { position: relative; z-index: 1; display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
      .side {
        position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 6px;
        padding: 20px 14px; border-right: 1px solid var(--line);
        background: linear-gradient(180deg, rgb(17 19 25 / 0.85), rgb(10 11 15 / 0.85));
        backdrop-filter: blur(14px);
      }
      .brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 18px; }
      .logo {
        width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 8px 24px -8px rgb(169 121 255 / 0.7);
        font-weight: 700; color: #140d1f; font-size: 16px;
      }
      .brand b { display: block; font-size: 14.5px; letter-spacing: 0.01em; }
      .brand span { display: block; font-size: 12px; color: var(--dim); }
      .nav { display: grid; gap: 3px; }
      .nav button {
        display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 11px;
        border: 0; border-radius: 11px; background: none; color: var(--dim); cursor: pointer;
        text-align: left; font-weight: 500; transition: background 0.18s var(--ease), color 0.18s var(--ease);
        position: relative;
      }
      .nav button svg { width: 18px; height: 18px; flex: none; opacity: 0.85; }
      .nav button:hover { background: var(--hover); color: var(--text); }
      .nav button.on { background: var(--accent-soft); color: var(--text); }
      .nav button.on::before {
        content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0;
        background: linear-gradient(var(--accent), var(--accent-2));
      }
      .nav button.on svg { color: var(--accent); opacity: 1; }
      .side-foot { margin-top: auto; display: grid; gap: 10px; }
      .live {
        display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 13px;
        background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px;
      }
      .live .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); position: relative; flex: none; }
      .live .pulse::after {
        content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--ok);
        animation: ping 1.8s var(--ease) infinite; opacity: 0;
      }
      .live.off .pulse { background: var(--bad); }
      .live.off .pulse::after { border-color: var(--bad); }
      @keyframes ping { 0% { transform: scale(0.6); opacity: 0.7; } 100% { transform: scale(1.8); opacity: 0; } }

      .main { min-width: 0; padding: 30px 36px 80px; }
      .page-head {
        display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap;
        margin-bottom: 24px; max-width: 1600px;
      }
      .page-head h1 { margin: 0; font-size: 25px; font-weight: 700; letter-spacing: -0.02em; }
      .page-head p { margin: 5px 0 0; color: var(--dim); max-width: 680px; }
      .page-actions { display: flex; gap: 10px; flex-wrap: wrap; }
      #view { max-width: 1600px; }
      .enter { animation: viewIn 0.38s var(--ease) both; }
      @keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .stagger > * { animation: rise 0.42s var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms); }
      @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(0.99); } to { opacity: 1; transform: none; } }

      /* ---------------------------------------------------------------- pieces */
      .card {
        background: linear-gradient(180deg, var(--surface-2), var(--surface));
        border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow);
      }
      .card-pad { padding: 18px 20px; }
      .section-title {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        margin: 28px 0 12px; font-size: 13px; font-weight: 600; color: var(--dim);
        text-transform: uppercase; letter-spacing: 0.07em;
      }
      .section-title:first-child { margin-top: 0; }

      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 15px;
        border-radius: 11px; border: 1px solid var(--line-2); background: var(--elev); cursor: pointer;
        font-weight: 500; white-space: nowrap; transition: background 0.16s, border-color 0.16s, transform 0.08s, box-shadow 0.16s;
      }
      .btn:hover { background: var(--hover); border-color: rgb(255 255 255 / 0.18); }
      .btn:active { transform: translateY(1px) scale(0.99); }
      .btn:disabled { opacity: 0.5; pointer-events: none; }
      .btn svg { width: 16px; height: 16px; }
      .btn.primary {
        border: 0; color: #150d20; font-weight: 600;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 8px 22px -10px rgb(169 121 255 / 0.9);
      }
      .btn.primary:hover { filter: brightness(1.07); background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
      .btn.sm { height: 32px; padding: 0 11px; border-radius: 9px; font-size: 13px; }
      .btn.ghost { background: transparent; border-color: transparent; color: var(--dim); }
      .btn.ghost:hover { background: var(--hover); color: var(--text); }
      .btn.danger { color: var(--bad); }
      .btn.danger:hover { background: var(--bad-soft); border-color: rgb(251 111 126 / 0.35); }
      .btn.icon { width: 34px; height: 34px; padding: 0; border-radius: 10px; }
      .btn.icon.sm { width: 30px; height: 30px; }

      .badge {
        display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px;
        font-size: 11.5px; font-weight: 500; white-space: nowrap; background: rgb(255 255 255 / 0.06); color: var(--dim);
        border: 1px solid transparent;
      }
      .badge svg { width: 12px; height: 12px; }
      .badge.violet { background: var(--accent-soft); color: #cdb3ff; }
      .badge.green { background: var(--ok-soft); color: var(--ok); }
      .badge.amber { background: var(--warn-soft); color: var(--warn); }
      .badge.red { background: var(--bad-soft); color: var(--bad); }
      .badge.blue { background: var(--info-soft); color: var(--info); }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }

      .switch {
        position: relative; width: 38px; height: 22px; border-radius: 999px; border: 0; cursor: pointer; flex: none;
        background: rgb(255 255 255 / 0.12); transition: background 0.22s var(--ease); padding: 0;
      }
      .switch::after {
        content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
        background: #fff; box-shadow: 0 2px 6px rgb(0 0 0 / 0.35); transition: transform 0.24s var(--ease);
      }
      .switch.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
      .switch.on::after { transform: translateX(16px); }
      .switch:disabled { opacity: 0.5; cursor: default; }
      .switch-row { display: inline-flex; align-items: center; gap: 9px; color: var(--dim); font-size: 13px; cursor: pointer; }

      input, select {
        width: 100%; height: 40px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--line-2);
        background: rgb(0 0 0 / 0.25); color: var(--text); min-width: 0;
        transition: border-color 0.16s, box-shadow 0.16s, background 0.16s;
      }
      input::placeholder { color: var(--faint); }
      input:hover, select:hover { border-color: rgb(255 255 255 / 0.18); }
      input:focus, select:focus, .btn:focus-visible, .switch:focus-visible, .nav button:focus-visible {
        outline: none; border-color: rgb(169 121 255 / 0.7); box-shadow: 0 0 0 4px rgb(169 121 255 / 0.18);
      }
      input:disabled { opacity: 0.6; }
      select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%); background-position: calc(100% - 17px) 17px, calc(100% - 12px) 17px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
      select option { background: #151821; }
      input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
      .field { display: grid; gap: 6px; min-width: 0; align-content: start; }
      .field > span { font-size: 12.5px; color: var(--dim); font-weight: 500; }
      .field small { color: var(--faint); font-size: 12px; line-height: 1.4; }
      .form-grid { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .form-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .form-grid .full { grid-column: 1 / -1; }
      .search { position: relative; }
      .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); pointer-events: none; }
      .search input { padding-left: 38px; }

      .seg {
        display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; background: rgb(0 0 0 / 0.3);
        border: 1px solid var(--line); flex-wrap: wrap;
      }
      .seg button {
        height: 32px; padding: 0 13px; border-radius: 9px; border: 0; background: none; color: var(--dim);
        cursor: pointer; font-weight: 500; font-size: 13px; transition: background 0.18s, color 0.18s;
      }
      .seg button:hover { color: var(--text); }
      .seg button.on { background: var(--elev); color: var(--text); box-shadow: 0 1px 0 rgb(255 255 255 / 0.06) inset, 0 4px 12px -6px rgb(0 0 0 / 0.8); }

      .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
      .toolbar .search { flex: 1 1 260px; max-width: 420px; }

      .empty {
        display: grid; place-items: center; gap: 8px; text-align: center; padding: 44px 20px; color: var(--dim);
        border: 1px dashed var(--line-2); border-radius: var(--r-lg);
      }
      .empty svg { width: 30px; height: 30px; color: var(--faint); }

      .skel { position: relative; overflow: hidden; background: rgb(255 255 255 / 0.05); border-radius: var(--r-lg); }
      .skel::after {
        content: ""; position: absolute; inset: 0; transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.06), transparent);
        animation: shimmer 1.3s infinite;
      }
      @keyframes shimmer { to { transform: translateX(100%); } }

      /* ------------------------------------------------------------------ kpis */
      .kpis { display: grid; gap: 14px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .kpi { padding: 17px 18px; display: grid; gap: 6px; position: relative; overflow: hidden; }
      .kpi .k-label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--dim); font-weight: 500; }
      .kpi .k-label svg { width: 15px; height: 15px; color: var(--accent); }
      .kpi .k-val { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
      .kpi .k-val small { font-size: 14px; color: var(--faint); font-weight: 500; }
      .kpi .k-sub { font-size: 12px; color: var(--faint); }
      .meter { height: 6px; border-radius: 999px; background: rgb(255 255 255 / 0.07); overflow: hidden; margin-top: 4px; }
      .meter > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.6s var(--ease); }
      .meter.ok > i { background: linear-gradient(90deg, #22c58b, var(--ok)); }
      .meter.warn > i { background: linear-gradient(90deg, #f59e0b, var(--warn)); }
      .meter.bad > i { background: linear-gradient(90deg, #f43f5e, var(--bad)); }
      .two { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }

      .bars { display: grid; gap: 11px; }
      .bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
      .bar-row .b-name { min-width: 0; }
      .bar-row .b-val { font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; }
      .bar-row .meter { grid-column: 1 / -1; margin: 0; height: 5px; }

      /* ------------------------------------------------------------ list rows */
      .list { display: grid; gap: 10px; }
      .item {
        display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center;
        padding: 15px 16px 15px 18px; transition: border-color 0.18s, transform 0.18s var(--ease), background 0.18s;
      }
      .item:hover { border-color: var(--line-2); }
      /* Dimmed content, not the card: the entrance animation owns opacity. */
      .item.off > :first-child, .is-off .up-head > :nth-child(-n + 2), .is-off .keys { opacity: 0.5; filter: saturate(0.5); transition: opacity 0.2s; }
      .item.off:hover > :first-child, .is-off:hover .up-head > :nth-child(-n + 2), .is-off:hover .keys { opacity: 0.85; }
      .switch.sm { width: 32px; height: 19px; }
      .switch.sm::after { width: 13px; height: 13px; }
      .switch.sm.on::after { transform: translateX(13px); }
      .i-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
      .i-title b { font-weight: 600; font-size: 15px; letter-spacing: -0.005em; max-width: 100%; }
      .i-sub { display: flex; align-items: center; gap: 7px; margin-top: 5px; color: var(--dim); font-size: 12.5px; min-width: 0; }
      .i-sub .sep { color: var(--faint); }
      .i-right { display: flex; align-items: center; gap: 8px; }
      .move { display: flex; align-items: center; gap: 2px; }
      .drag { cursor: grab; touch-action: none; }
      .drag:active { cursor: grabbing; }
      .item.dragging { opacity: 0.45; }
      .item.drop-above { box-shadow: inset 0 2px 0 var(--accent); }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
      .chip {
        display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 10px; border-radius: 9px;
        background: rgb(0 0 0 / 0.28); border: 1px solid var(--line); font-size: 12.5px; white-space: nowrap;
      }
      .chip i { font-style: normal; color: var(--faint); font-size: 11.5px; }
      .chip b { font-weight: 600; font-variant-numeric: tabular-nums; }
      .clickable { cursor: pointer; }
      .clickable:hover { background: linear-gradient(180deg, #1a1e28, #13161d); }
      .avatar {
        width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none;
        font-weight: 700; font-size: 14px; color: #fff; background: linear-gradient(135deg, #3b3263, #2a2f45);
        border: 1px solid var(--line-2);
      }
      .row { display: flex; align-items: center; gap: 10px; min-width: 0; }

      /* providers: keys */
      .up-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 18px; }
      .keys { border-top: 1px solid var(--line); padding: 6px 10px 12px; }
      .key {
        display: grid; grid-template-columns: minmax(120px, 190px) auto auto minmax(0, 1fr) auto; gap: 14px; align-items: center;
        padding: 9px 8px; border-radius: 10px;
      }
      .key:hover { background: rgb(255 255 255 / 0.025); }
      .key .err { color: var(--faint); font-size: 12px; }
      .add-key { display: flex; gap: 8px; padding: 8px 8px 0; }
      .grok-box { display: grid; gap: 10px; padding: 8px 8px 2px; }
      .grok-wait {
        display: grid; gap: 6px; padding: 12px 14px; border-radius: 12px;
        background: var(--accent-soft); border: 1px solid rgb(169 121 255 / 0.28);
      }
      .grok-wait .code { font-size: 22px; letter-spacing: 0.14em; font-weight: 700; }
      .grok-wait a { color: #d9c8ff; font-weight: 600; }
      .grok-actions { display: flex; flex-wrap: wrap; gap: 8px; }

      /* ----------------------------------------------------------------- drawer */
      .scrim {
        position: fixed; inset: 0; z-index: 40; background: rgb(3 4 8 / 0.55); backdrop-filter: blur(4px);
        opacity: 0; pointer-events: none; transition: opacity 0.25s var(--ease);
      }
      .scrim.on { opacity: 1; pointer-events: auto; }
      .drawer {
        position: fixed; top: 10px; right: 10px; bottom: 10px; z-index: 41; width: min(560px, calc(100vw - 20px));
        display: flex; flex-direction: column; border-radius: 22px; overflow: hidden;
        background: linear-gradient(180deg, #151822, #0f1117); border: 1px solid var(--line-2);
        box-shadow: -30px 0 80px -20px rgb(0 0 0 / 0.8);
        transform: translateX(calc(100% + 30px)); transition: transform 0.36s var(--ease), width 0.3s var(--ease);
      }
      .drawer.on { transform: none; }
      .drawer.wide { width: min(1000px, calc(100vw - 20px)); }
      .d-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 22px 16px; border-bottom: 1px solid var(--line); }
      .d-head h2 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; word-break: break-word; }
      .d-head p { margin: 4px 0 0; color: var(--dim); font-size: 13px; word-break: break-word; }
      .d-head .btn { margin-left: auto; }
      .d-body { flex: 1; overflow-y: auto; padding: 20px 22px 26px; display: grid; gap: 22px; align-content: start; }
      .d-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 22px; border-top: 1px solid var(--line); background: rgb(0 0 0 / 0.2); }
      .d-sec { display: grid; gap: 12px; }
      .d-sec > h3 { margin: 0; font-size: 12px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 0.07em; }
      .hint { color: var(--faint); font-size: 12.5px; line-height: 1.55; margin: 0; }
      .callout {
        display: flex; gap: 12px; padding: 13px 15px; border-radius: 13px; background: var(--accent-soft);
        border: 1px solid rgb(169 121 255 / 0.25); font-size: 13px; line-height: 1.5; color: #d9c8ff;
      }
      .callout svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
      .callout.warn { background: var(--warn-soft); border-color: rgb(251 191 36 / 0.25); color: #fde3a4; }
      .secret {
        display: grid; gap: 10px; padding: 14px; border-radius: 13px; background: rgb(0 0 0 / 0.35);
        border: 1px solid rgb(169 121 255 / 0.35);
      }
      .secret code { font-family: var(--mono); font-size: 12px; word-break: break-all; line-height: 1.55; color: #e6dbff; }

      .catalog { border: 1px solid var(--line-2); border-radius: 13px; overflow: hidden; }
      .catalog .search input { border: 0; border-radius: 0; border-bottom: 1px solid var(--line); background: rgb(0 0 0 / 0.2); }
      .cat-list { max-height: 280px; overflow-y: auto; }
      .cat-item {
        display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%;
        padding: 10px 13px; border: 0; border-bottom: 1px solid var(--line); background: none; cursor: pointer; text-align: left;
      }
      .cat-item:last-child { border-bottom: 0; }
      .cat-item:hover { background: var(--hover); }
      .cat-item.on { background: var(--accent-soft); }
      .cat-item .mono { color: var(--faint); font-size: 11.5px; }

      .choice { display: grid; gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .choice.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .choice button {
        display: grid; gap: 4px; align-content: start; text-align: left; padding: 12px 13px; border-radius: 13px; cursor: pointer;
        border: 1px solid var(--line-2); background: rgb(0 0 0 / 0.22); transition: border-color 0.18s, background 0.18s, box-shadow 0.18s;
      }
      .choice button:hover { border-color: rgb(255 255 255 / 0.2); }
      .choice button b { font-size: 13.5px; font-weight: 600; }
      .choice button span { font-size: 12px; color: var(--dim); line-height: 1.4; }
      .choice button.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }

      table { width: 100%; border-collapse: separate; border-spacing: 0; }
      th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; padding: 0 10px 9px; white-space: nowrap; }
      td { padding: 10px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: middle; }
      tbody tr { transition: background 0.14s; }
      tbody tr:hover td { background: rgb(255 255 255 / 0.02); }
      .hosts tr.picked td { background: rgb(169 121 255 / 0.07); }
      .hosts tr.first td:first-child { box-shadow: 3px 0 0 var(--ok) inset; }
      .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; padding-top: 10px; }

      .gauges { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .gauge { padding: 14px 15px; display: grid; gap: 6px; border-radius: 14px; background: rgb(0 0 0 / 0.28); border: 1px solid var(--line); }
      .gauge .g-l { font-size: 12px; color: var(--dim); }
      .gauge .g-v { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .gauge .g-v small { font-size: 12.5px; color: var(--faint); font-weight: 500; }
      .gauge .g-s { font-size: 11.5px; color: var(--faint); }
      .gauge.wallet { border-color: rgb(169 121 255 / 0.35); }
      .chart { width: 100%; height: 130px; display: block; }
      .chart rect { transition: opacity 0.15s; }
      .chart rect:hover { opacity: 0.75; }
      .devices { display: grid; gap: 8px; }
      .device { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgb(0 0 0 / 0.25); border: 1px solid var(--line); }
      .device small { display: block; color: var(--faint); font-size: 11.5px; margin-top: 2px; }

      /* ------------------------------------------------------------- dialogs */
      .modal-back { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; background: rgb(3 4 8 / 0.6); backdrop-filter: blur(5px); animation: fade 0.2s both; }
      .modal { width: min(420px, 100%); padding: 22px; border-radius: 20px; background: linear-gradient(180deg, #181b25, #11131a); border: 1px solid var(--line-2); box-shadow: 0 30px 80px -20px rgb(0 0 0 / 0.9); animation: pop 0.26s var(--ease) both; }
      .modal h3 { margin: 0 0 8px; font-size: 17px; }
      .modal p { margin: 0 0 20px; color: var(--dim); line-height: 1.55; }
      .modal .acts { display: flex; justify-content: flex-end; gap: 10px; }
      @keyframes fade { from { opacity: 0; } }
      @keyframes pop { from { opacity: 0; transform: scale(0.94) translateY(6px); } }

      .toasts { position: fixed; right: 18px; bottom: 18px; z-index: 80; display: grid; gap: 10px; justify-items: end; pointer-events: none; }
      .toast {
        display: flex; align-items: center; gap: 11px; max-width: min(440px, calc(100vw - 36px)); padding: 12px 15px;
        border-radius: 14px; background: #1a1d27; border: 1px solid var(--line-2); box-shadow: 0 18px 40px -12px rgb(0 0 0 / 0.8);
        animation: toastIn 0.34s var(--ease) both; pointer-events: auto; font-size: 13.5px;
      }
      .toast.out { animation: toastOut 0.25s var(--ease) both; }
      .toast .t-ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--ok-soft); color: var(--ok); }
      .toast.bad .t-ic { background: var(--bad-soft); color: var(--bad); }
      .toast .t-ic svg { width: 15px; height: 15px; }
      @keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(0.97); } }
      @keyframes toastOut { to { opacity: 0; transform: translateX(20px); } }

      /* -------------------------------------------------------------- login */
      .login { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 20px; background: var(--bg); }
      .login::before { content: ""; position: absolute; inset: 0; background: radial-gradient(600px 400px at 50% 20%, rgb(169 121 255 / 0.18), transparent 70%); }
      .login-card { position: relative; width: min(400px, 100%); padding: 30px; display: grid; gap: 18px; animation: pop 0.4s var(--ease) both; }
      .login-card .logo { width: 46px; height: 46px; border-radius: 14px; font-size: 20px; }
      .login-card h2 { margin: 0; font-size: 21px; letter-spacing: -0.01em; }
      .login-card p { margin: 4px 0 0; color: var(--dim); }
      .hidden { display: none !important; }

      @media (max-width: 1100px) {
        .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .two { grid-template-columns: 1fr; }
      }
      @media (max-width: 860px) {
        .app { grid-template-columns: minmax(0, 1fr); }
        .side { position: sticky; top: 0; z-index: 20; height: auto; flex-direction: row; align-items: center; padding: 10px 12px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
        .brand { padding: 0 8px 0 0; }
        .brand div { display: none; }
        .nav { display: flex; gap: 2px; }
        .nav button { width: auto; padding: 8px 10px; }
        .nav button span { display: none; }
        .nav button.on::before { display: none; }
        .side-foot { margin: 0 0 0 auto; display: flex; }
        .live { display: none; }
        .main { padding: 20px 14px 70px; }
        .form-grid, .form-grid.three, .choice, .choice.four, .gauges { grid-template-columns: 1fr 1fr; }
        .key { grid-template-columns: minmax(0, 1fr) auto auto; }
        .key .err, .key .stats { display: none; }
      }
      @media (max-width: 520px) {
        .kpis, .form-grid, .form-grid.three, .gauges { grid-template-columns: 1fr; }
        .item { grid-template-columns: minmax(0, 1fr); }
        .item .i-right { justify-content: flex-end; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="login hidden" id="login">
      <form class="card login-card" id="login-form">
        <div class="logo">V</div>
        <div>
          <h2>Панель шлюза</h2>
          <p>VelvetDesk Cloud — вход для администратора</p>
        </div>
        <label class="field">
          <span>Admin-токен</span>
          <input id="token" type="password" placeholder="VD_ADMIN_TOKEN" autocomplete="off" autocapitalize="off" spellcheck="false" />
        </label>
        <button class="btn primary" type="submit" style="height:42px">Войти</button>
      </form>
    </div>

    <div class="app">
      <aside class="side">
        <div class="brand">
          <div class="logo">V</div>
          <div><b>VelvetDesk</b><span>шлюз · админка</span></div>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="side-foot">
          <div class="live" id="live"><span class="pulse"></span><span id="live-text" class="ell">подключаюсь…</span></div>
          <button class="btn ghost sm" id="logout" title="выйти">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            <span>Выйти</span>
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="page-head">
          <div>
            <h1 id="page-title">Обзор</h1>
            <p id="page-sub"></p>
          </div>
          <div class="page-actions" id="page-actions"></div>
        </header>
        <div id="view"></div>
      </main>
    </div>

    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" role="dialog" aria-modal="true">
      <div class="d-head">
        <div style="min-width:0">
          <h2 id="d-title">—</h2>
          <p id="d-sub"></p>
        </div>
        <button class="btn icon ghost" id="d-close" title="закрыть">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="d-body" id="d-body"></div>
      <div class="d-foot hidden" id="d-foot"></div>
    </aside>

    <div class="toasts" id="toasts"></div>

    <script>
      // ============================================================ basics
      const $ = (id) => document.getElementById(id);
      const esc = (text) =>
        String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const num = (value) => {
        const parsed = Number(String(value ?? "").replace(",", "."));
        return Number.isFinite(parsed) ? parsed : 0;
      };
      const maybe = (value) => (String(value ?? "").trim() === "" ? null : num(value));
      const dt = (ts) => new Date(ts * 1000).toLocaleDateString("ru-RU");
      const dtime = (ts) => new Date(ts * 1000).toLocaleString("ru-RU", { dateStyle: "short", timeStyle: "short" });
      const usd = (v, digits = 2) => "$" + (Number(v) || 0).toFixed(digits);
      const price = (v) => (v == null ? "—" : "$" + (+v).toFixed(v < 0.1 ? 4 : 3).replace(/0+$/, "").replace(/\.$/, ""));
      const fmt = (n) => (Number(n) || 0).toLocaleString("ru-RU", { maximumFractionDigits: 1 });
      const initials = (s) => String(s || "?").replace(/[^A-Za-zА-Яа-я0-9]/g, " ").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "?";

      const I = {
        overview: '<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',
        providers: '<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
        models: '<path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="m3 17 9 5 9-5"/><path d="m3 12 9 5 9-5"/>',
        tiers: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
        licenses: '<circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.2-8.2M17 6l2 2M15 8l2 2"/>',
        stats: '<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
        trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
        edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
        route: '<circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M9 19h6.5a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H15"/>',
        check: '<path d="M20 6 9 17l-5-5"/>',
        x: '<path d="M18 6 6 18M6 6l12 12"/>',
        eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
        mic: '<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/>',
        image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
        chev: '<path d="m9 18 6-6-6-6"/>',
        chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/>',
        info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
        activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
        users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
        coin: '<circle cx="12" cy="12" r="9"/><path d="M14.5 9.5a2.5 2 0 0 0-2.5-1.5c-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2a2.5 2 0 0 1-2.5-1.5M12 6v2M12 16v2"/>',
        queue: '<path d="M3 6h18M3 12h12M3 18h7"/>',
        key: '<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>',
        copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
        up: '<path d="m18 15-6-6-6 6"/>',
        grip: '<circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/>',
        down: '<path d="m6 9 6 6 6-6"/>',
        refresh: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
      };
      const icon = (name, size = 16) =>
        `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[name] || ""}</svg>`;

      // ============================================================ toasts
      function toast(text, bad) {
        const el = document.createElement("div");
        el.className = "toast" + (bad ? " bad" : "");
        el.innerHTML = `<span class="t-ic">${icon(bad ? "x" : "check")}</span><span>${esc(text)}</span>`;
        $("toasts").appendChild(el);
        setTimeout(() => {
          el.classList.add("out");
          setTimeout(() => el.remove(), 260);
        }, bad ? 5200 : 3000);
      }

      function confirmBox({ title, text, ok = "Удалить", danger = true }) {
        return new Promise((resolve) => {
          const back = document.createElement("div");
          back.className = "modal-back";
          back.innerHTML = `<div class="modal" role="alertdialog">
            <h3>${esc(title)}</h3><p>${esc(text)}</p>
            <div class="acts"><button class="btn" data-no>Отмена</button>
            <button class="btn ${danger ? "danger" : "primary"}" data-yes>${esc(ok)}</button></div></div>`;
          const done = (value) => {
            back.remove();
            document.removeEventListener("keydown", onKey);
            resolve(value);
          };
          const onKey = (e) => {
            if (e.key === "Escape") done(false);
            if (e.key === "Enter") done(true);
          };
          back.addEventListener("click", (e) => e.target === back && done(false));
          back.querySelector("[data-no]").onclick = () => done(false);
          back.querySelector("[data-yes]").onclick = () => done(true);
          document.addEventListener("keydown", onKey);
          document.body.appendChild(back);
          back.querySelector("[data-yes]").focus();
        });
      }

      // ============================================================ api
      let token = sessionStorage.getItem("vd-admin") || "";

      async function call(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: { "content-type": "application/json", "x-vd-admin": token, ...(options.headers || {}) },
        });
        const body = await response.json().catch(() => ({}));
        if (response.status === 401 || response.status === 403) {
          sessionStorage.removeItem("vd-admin");
          token = "";
          showLogin(body?.error?.message || "Неверный токен");
          throw new Error(body?.error?.message || "нужен admin-токен");
        }
        if (!response.ok) throw new Error(body?.error?.message || response.statusText);
        return body;
      }

      // Runs a button's action with a spinner-free "busy" state and a toast
      // on failure, so every handler is not a try/catch of its own.
      async function act(button, fn, okText) {
        if (button) button.disabled = true;
        try {
          const out = await fn();
          if (okText) toast(okText);
          return out;
        } catch (error) {
          toast(error.message, true);
        } finally {
          if (button) button.disabled = false;
        }
      }

      // ============================================================ login
      function showLogin(reason) {
        $("login").classList.remove("hidden");
        $("token").value = "";
        setTimeout(() => $("token").focus(), 50);
        if (reason) toast(reason, true);
      }
      $("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        token = $("token").value.trim();
        if (!token) return;
        try {
          await call("/admin/overview");
          sessionStorage.setItem("vd-admin", token);
          $("login").classList.add("hidden");
          go(current);
        } catch {}
      });
      $("logout").addEventListener("click", () => {
        sessionStorage.removeItem("vd-admin");
        token = "";
        showLogin();
      });

      // ============================================================ drawer
      function openDrawer({ title, sub = "", wide = false }) {
        $("d-title").textContent = title;
        $("d-sub").textContent = sub;
        $("d-body").innerHTML = '<div class="skel" style="height:120px"></div><div class="skel" style="height:220px"></div>';
        $("d-foot").innerHTML = "";
        $("d-foot").classList.add("hidden");
        $("drawer").classList.toggle("wide", wide);
        $("drawer").classList.add("on");
        $("scrim").classList.add("on");
      }
      function drawerBody(html) {
        $("d-body").innerHTML = html;
        $("d-body").scrollTop = 0;
      }
      function drawerFoot(html) {
        $("d-foot").innerHTML = html;
        $("d-foot").classList.toggle("hidden", !html);
      }
      function closeDrawer() {
        $("drawer").classList.remove("on");
        $("scrim").classList.remove("on");
      }
      $("d-close").onclick = closeDrawer;
      $("scrim").onclick = closeDrawer;
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && $("drawer").classList.contains("on") && !document.querySelector(".modal-back")) closeDrawer();
      });

      // ============================================================ nav
      const PAGES = [
        { id: "overview", title: "Обзор", icon: "overview", sub: "Что происходит со шлюзом прямо сейчас." },
        { id: "upstreams", title: "Провайдеры", icon: "providers", sub: "Куда шлюз отправляет запросы и какими ключами платит." },
        { id: "models", title: "Модели", icon: "models", sub: "Что доступно клиентам, по какой цене и в каком порядке падения." },
        { id: "tiers", title: "Тарифы", icon: "tiers", sub: "Сколько кредитов даёт подписка и на сколько устройств." },
        { id: "licenses", title: "Лицензии", icon: "licenses", sub: "Все выданные ключи: расход, устройства, кошелёк." },
        { id: "stats", title: "Расход", icon: "stats", sub: "Кто и на что тратит, в кредитах и деньгах." },
      ];
      let current = sessionStorage.getItem("vd-admin-page") || "overview";
      let pollTimer = null;

      $("nav").innerHTML = PAGES.map(
        (p) => `<button data-page="${p.id}">${icon(p.icon, 18)}<span>${p.title}</span></button>`,
      ).join("");
      $("nav").addEventListener("click", (e) => {
        const b = e.target.closest("[data-page]");
        if (b) go(b.dataset.page);
      });

      function setHead(page, actions = "") {
        $("page-title").textContent = page.title;
        $("page-sub").textContent = page.sub;
        $("page-actions").innerHTML = actions;
      }

      function skeleton(rows = 4, h = 86) {
        return `<div class="list">${Array.from({ length: rows }, () => `<div class="skel" style="height:${h}px"></div>`).join("")}</div>`;
      }

      function view(html) {
        const v = $("view");
        v.innerHTML = html;
        v.classList.remove("enter");
        void v.offsetWidth;
        v.classList.add("enter");
        v.querySelectorAll(".stagger").forEach((list) =>
          [...list.children].forEach((child, i) => child.style.setProperty("--i", Math.min(i, 12))),
        );
      }

      async function go(pageId) {
        const page = PAGES.find((p) => p.id === pageId) || PAGES[0];
        current = page.id;
        sessionStorage.setItem("vd-admin-page", current);
        document.querySelectorAll("#nav [data-page]").forEach((b) => b.classList.toggle("on", b.dataset.page === current));
        clearInterval(pollTimer);
        if (!token) return showLogin();
        setHead(page);
        $("view").innerHTML = skeleton();
        try {
          await RENDER[current](page);
        } catch (error) {
          view(`<div class="empty">${icon("info", 30)}<div>${esc(error.message)}</div></div>`);
        }
      }

      // Live strip in the sidebar: the queue, every few seconds.
      async function refreshLive() {
        if (!token) return;
        try {
          const o = await fetch("/admin/overview", { headers: { "x-vd-admin": token } }).then((r) => (r.ok ? r.json() : Promise.reject()));
          $("live").classList.remove("off");
          $("live-text").textContent = `в работе ${o.queue.inflight} · очередь ${o.queue.queued}`;
        } catch {
          $("live").classList.add("off");
          $("live-text").textContent = "нет связи";
        }
      }
      setInterval(refreshLive, 6000);

      // Periods the spend figures can cover; 0 hours is all time.
      const PERIODS = [
        [24, "Сутки", "за сутки"],
        [168, "Неделя", "за неделю"],
        [720, "Месяц", "за месяц"],
        [0, "Всё время", "за всё время"],
      ];
      const periodSeg = (id, value) =>
        `<div class="seg" id="${id}">${PERIODS.map(([h, t]) => `<button data-h="${h}" class="${value === h ? "on" : ""}">${t}</button>`).join("")}</div>`;
      let overviewHours = Number(sessionStorage.getItem("vd-admin-ov-hours") ?? 24);

      // ============================================================ overview
      async function renderOverview(page) {
        setHead(page, `${periodSeg("ov-seg", overviewHours)}<button class="btn" id="ov-refresh">${icon("refresh")}Обновить</button>`);
        $("ov-seg").onclick = (e) => {
          const b = e.target.closest("[data-h]");
          if (!b) return;
          overviewHours = Number(b.dataset.h);
          sessionStorage.setItem("vd-admin-ov-hours", overviewHours);
          go("overview");
        };
        const periodText = (PERIODS.find(([h]) => h === overviewHours) || PERIODS[0])[2];
        const [o, s, lic] = await Promise.all([
          call("/admin/overview"),
          call(`/admin/stats?hours=${overviewHours}`).catch(() => null),
          call("/admin/licenses").catch(() => []),
        ]);
        const q = o.queue;
        const pct = (a, b) => (b > 0 ? Math.min(100, (a / b) * 100) : 0);

        const active = lic.filter((l) => !l.revoked && (!l.expires_at || l.expires_at * 1000 > Date.now())).length;
        const spent = s ? s.by_license.reduce((a, r) => a + r.credits, 0) : 0;
        const calls = s ? s.by_license.reduce((a, r) => a + r.calls, 0) : 0;
        const topModels = s ? [...s.by_model].sort((a, b) => b.credits - a.credits).slice(0, 6) : [];
        const topLic = s ? [...s.by_license].sort((a, b) => b.credits - a.credits).slice(0, 6) : [];

          <div class="section-title">Прямо сейчас</div>
          <div class="kpis stagger">
            ${kpi("activity", "В работе", `${q.inflight}<small> / ${q.max_inflight}</small>`, "одновременных вызовов к провайдерам", pct(q.inflight, q.max_inflight))}
            ${kpi("queue", "Ждут очереди", `${q.queued}<small> / ${q.max_queued}</small>`, "не дождавшиеся получают 503 + Retry-After", pct(q.queued, q.max_queued))}
            ${kpi("users", "На одну лицензию", q.max_per_license, "чтобы один оператор не занял весь шлюз")}
            ${kpi("coin", "Кредит", "$" + o.credit_usd, "себестоимость одного кредита")}
          </div>
          <div class="section-title">${periodText[0].toUpperCase() + periodText.slice(1)}</div>
          <div class="kpis stagger">
            ${kpi("coin", "Себестоимость", usd(spent * o.credit_usd), fmt(spent) + " кредитов " + periodText)}
            ${kpi("chat", "Запросов", fmt(calls), s ? "кеш: " + (s.cache_share * 100).toFixed(1) + "% входа" : "—")}
            ${kpi("key", "Активных лицензий", active, `всего выдано ${lic.length}`)}
            ${kpi("models", "Моделей чата", chat, `провайдеров включено ${ups} из ${o.upstreams.length}`)}
          </div>
          <div class="two" style="margin-top:14px">
            <div class="card card-pad">
              <div class="section-title" style="margin:0 0 14px">Модели по расходу</div>
              ${topModels.length ? `<div class="bars stagger">${topModels
                .map((r) => `<div class="bar-row"><span class="b-name mono ell">${esc(r.model)}</span>
                  <span class="b-val">${usd(r.credits * o.credit_usd, 3)}</span>
                  <div class="meter"><i style="width:${(r.credits / maxM) * 100}%"></i></div></div>`)
                .join("")}</div>` : `<div class="dim">Тихо — запросов ${periodText} не было</div>`}
            </div>
            <div class="card card-pad">
              <div class="section-title" style="margin:0 0 14px">Лицензии по расходу</div>
              ${topLic.length ? `<div class="bars stagger">${topLic
                .map((r) => `<div class="bar-row clickable" data-open-lic="${esc(r.license_id)}"><span class="b-name mono ell">${esc(r.license_id)}</span>
                  <span class="b-val">${usd(r.credits * o.credit_usd, 3)} · ${r.calls} запр.</span>
                  <div class="meter ok"><i style="width:${(r.credits / maxL) * 100}%"></i></div></div>`)
                .join("")}</div>` : `<div class="dim">Тихо — запросов ${periodText} не было</div>`}
            </div>
          </div>`);
        $("ov-refresh").onclick = () => go("overview");
        document.querySelectorAll("[data-open-lic]").forEach((el) => (el.onclick = () => openLicense(el.dataset.openLic)));
        pollTimer = setInterval(async () => {
          if (current !== "overview" || $("drawer").classList.contains("on")) return;
          try {
            const fresh = await call("/admin/overview");
            const cards = document.querySelectorAll(".kpis")[0]?.children;
            if (!cards) return;
            const fq = fresh.queue;
            cards[0].querySelector(".k-val").innerHTML = `${fq.inflight}<small> / ${fq.max_inflight}</small>`;
            cards[0].querySelector(".meter i").style.width = pct(fq.inflight, fq.max_inflight) + "%";
            cards[1].querySelector(".k-val").innerHTML = `${fq.queued}<small> / ${fq.max_queued}</small>`;
            cards[1].querySelector(".meter i").style.width = pct(fq.queued, fq.max_queued) + "%";
          } catch {}
        }, 5000);
      }

      // ============================================================ upstreams
      let upstreamCache = [];
      const GROK_BASE = "https://cli-chat-proxy.grok.com/v1";
      // In-flight browser sign-ins, so a redraw of the list keeps the user code up.
      const grokWaits = {};

      function kindBadge(up) {
        if (up.grok) return "Подписка Grok";
        return up.kind === "gemini" ? "Gemini" : "OpenAI-совместимый";
      }

      function keyRows(ks, grok) {
        if (!ks.length) {
          return grok
            ? `<div class="dim" style="padding:10px 8px">Сессий нет — войдите через браузер, затем назначьте модель как у остальных провайдеров.</div>`
            : `<div class="dim" style="padding:10px 8px">Ключей нет — добавьте хотя бы один, иначе провайдер не используется.</div>`;
        }
        return ks.map((k) => `<div class="key">
            <span class="mono ell">${esc(k.masked)}</span>
            ${k.cooling_seconds ? `<span class="badge amber"><span class="dot"></span>остывает ${k.cooling_seconds} с</span>` : `<span class="badge green"><span class="dot"></span>в строю</span>`}
            <span class="dim stats" style="font-size:12.5px">${k.session && k.expires_at ? `до ${dtime(k.expires_at)} · ` : ""}${k.successes} ок · ${k.failures} сбоев</span>
            <span class="err ell" title="${esc(k.last_error || "")}">${esc(k.last_error || "")}</span>
            <button class="btn icon sm ghost danger" data-key-del="${k.id}" title="${grok ? "выйти из этой сессии" : "удалить ключ"}">${icon("trash", 15)}</button>
          </div>`).join("");
      }

      function grokPanel(up, ks) {
        const wait = grokWaits[up.id];
        return `<div class="grok-box" data-grok-box="${esc(up.id)}" data-grok-signin="browser" data-flow="user-code verification-link">
            <div class="hint">Подписка Grok — вход через браузер, не ключ с console.x.ai. Здесь появятся код подтверждения (user code) и ссылка (verification link). Версию CLI шлюз подставляет сам.</div>
            ${keyRows(ks, true)}
            <div class="grok-wait${wait ? "" : " hidden"}" data-grok-wait="${esc(up.id)}">${wait ? grokWaitHtml(wait) : ""}</div>
            <div class="grok-actions">
              <button class="btn primary" data-grok-start="${esc(up.id)}">${ks.length ? "Добавить ещё вход" : "Войти через браузер"}</button>
              ${ks.length ? `<button class="btn" data-grok-out="${esc(up.id)}">Выйти</button>` : ""}
            </div>
          </div>`;
      }

      function grokWaitHtml(wait) {
        return `<div class="dim">Код подтверждения — user code</div>
          <div class="mono code">${esc(wait.user_code)}</div>
          <a href="${esc(wait.link)}" target="_blank" rel="noreferrer">Открыть ссылку подтверждения — verification link</a>
          <div class="${wait.error ? "err" : "dim"}">${esc(wait.message)}</div>`;
      }

      function paintGrokWait(id) {
        const wait = grokWaits[id];
        const host = document.querySelector(`[data-grok-wait="${CSS.escape(id)}"]`);
        if (!host || !wait) return;
        host.classList.remove("hidden");
        host.innerHTML = grokWaitHtml(wait);
      }

      async function renderUpstreams(page) {
        setHead(page, `<button class="btn primary" id="up-new">${icon("plus")}Добавить провайдера</button>`);
        $("up-new").onclick = () => upstreamForm();
        const data = await call("/admin/overview");
        upstreamCache = data.upstreams;
        const keys = await Promise.all(
          data.upstreams.map((up) => call(`/admin/upstreams/${encodeURIComponent(up.id)}/keys`).catch(() => [])),
        );
        if (!data.upstreams.length) {
          view(`<div class="empty">${icon("providers", 30)}<div>Провайдеров пока нет</div><button class="btn primary" onclick="upstreamForm()">${icon("plus")}Добавить первого</button></div>`);
          return;
        }
        view(`<div class="list stagger">${data.upstreams
          .map((up, i) => {
            const ks = keys[i];
            const live = ks.filter((k) => !k.cooling_seconds).length;
            return `<div class="card up ${up.enabled ? "" : "is-off"}">
              <div class="up-head">
                <div class="avatar">${esc(initials(up.label || up.id))}</div>
                <div style="min-width:0">
                  <div class="i-title row" style="flex-wrap:wrap;gap:8px"><b class="ell" style="font-size:15.5px">${esc(up.label || up.id)}</b>
                    <span class="badge">${esc(kindBadge(up))}</span>
                    ${up.reasoning_dialect && up.reasoning_dialect !== "auto" ? `<span class="badge violet">${esc(up.reasoning_dialect)}</span>` : ""}
                    <span class="badge ${ks.length ? (live ? "green" : "amber") : "red"}"><span class="dot"></span>${ks.length ? `${live} из ${ks.length} ${up.grok ? "сессий" : "ключей"} в строю` : (up.grok ? "нет сессии" : "нет ключей")}</span>
                  </div>
                  <div class="i-sub"><span class="mono">${esc(up.id)}</span><span class="sep">·</span><span class="ell">${esc(up.base_url)}</span></div>
                </div>
                <div class="i-right">
                  <label class="switch-row" title="${up.enabled ? "включён" : "выключен"}"><button class="switch ${up.enabled ? "on" : ""}" data-up-toggle="${esc(up.id)}" role="switch" aria-checked="${up.enabled}"></button></label>
                  <button class="btn icon sm ghost" data-up-edit="${esc(up.id)}" title="изменить">${icon("edit")}</button>
                  <button class="btn icon sm ghost danger" data-up-del="${esc(up.id)}" title="удалить">${icon("trash")}</button>
                </div>
              </div>
              <div class="keys">
                ${up.grok ? grokPanel(up, ks) : `${keyRows(ks, false)}
                <div class="add-key">
                  <input placeholder="Вставьте ключ или несколько через запятую" data-key-for="${esc(up.id)}" />
                  <button class="btn" data-key-add="${esc(up.id)}">${icon("plus")}Ключ</button>
                </div>`}
              </div>
            </div>`;
          })
          .join("")}</div>`);

        document.querySelectorAll("[data-up-toggle]").forEach((b) => {
          b.onclick = () => {
            const up = upstreamCache.find((u) => u.id === b.dataset.upToggle);
            b.classList.toggle("on");
            act(b, () => call("/admin/upstreams", { method: "POST", body: JSON.stringify({ ...up, enabled: !up.enabled }) }))
              .then(() => go("upstreams"));
          };
        });
        document.querySelectorAll("[data-up-edit]").forEach((b) => (b.onclick = () => upstreamForm(upstreamCache.find((u) => u.id === b.dataset.upEdit))));
        document.querySelectorAll("[data-up-del]").forEach((b) => {
          b.onclick = async () => {
            const id = b.dataset.upDel;
            if (!(await confirmBox({ title: `Удалить «${id}»?`, text: "Вместе с провайдером удалятся его ключи и модели. Это не отменить." }))) return;
            act(b, () => call(`/admin/upstreams/${encodeURIComponent(id)}`, { method: "DELETE" }), "Провайдер удалён").then(() => go("upstreams"));
          };
        });
        document.querySelectorAll("[data-key-del]").forEach((b) => {
          b.onclick = async () => {
            if (!(await confirmBox({ title: "Удалить ключ?", text: "Ключ исчезнет из пула сразу, запросы пойдут на остальные." }))) return;
            act(b, () => call(`/admin/keys/${b.dataset.keyDel}`, { method: "DELETE" }), "Ключ удалён").then(() => go("upstreams"));
          };
        });
        const addKey = (id, button) => {
          const input = document.querySelector(`[data-key-for="${CSS.escape(id)}"]`);
          if (!input.value.trim()) return input.focus();
          act(button, async () => {
            const r = await call(`/admin/upstreams/${encodeURIComponent(id)}/keys`, { method: "POST", body: JSON.stringify({ key: input.value }) });
            toast(`Добавлено ключей: ${r.added}`);
            go("upstreams");
          });
        };
        document.querySelectorAll("[data-key-add]").forEach((b) => (b.onclick = () => addKey(b.dataset.keyAdd, b)));
        document.querySelectorAll("[data-key-for]").forEach((input) =>
          input.addEventListener("keydown", (e) => e.key === "Enter" && addKey(input.dataset.keyFor)),
        );
        document.querySelectorAll("[data-grok-start]").forEach((b) => (b.onclick = () => startGrok(b.dataset.grokStart, b)));
        document.querySelectorAll("[data-grok-out]").forEach((b) => {
          b.onclick = async () => {
            const id = b.dataset.grokOut;
            if (!(await confirmBox({ title: "Выйти из подписки Grok?", text: "Сессии этого провайдера будут удалены. Войти можно снова.", ok: "Выйти" }))) return;
            act(b, () => call(`/admin/upstreams/${encodeURIComponent(id)}/grok/logout`, { method: "POST" }), "Вышли").then(() => go("upstreams"));
          };
        });
      }

      async function startGrok(id, button) {
        await act(button, async () => {
          const start = await call(`/admin/upstreams/${encodeURIComponent(id)}/grok/login`, { method: "POST" });
          grokWaits[id] = {
            user_code: start.user_code,
            link: start.verification_uri_complete || start.verification_uri,
            message: "Жду подтверждения в браузере…",
            error: false,
          };
          paintGrokWait(id);
          const deadline = Date.now() + (start.expires_in || 600) * 1000;
          const interval = Math.max(2, start.interval || 5) * 1000;
          while (Date.now() < deadline) {
            await new Promise((resolve) => setTimeout(resolve, interval));
            if (!grokWaits[id]) return;
            let poll;
            try {
              poll = await call(`/admin/upstreams/${encodeURIComponent(id)}/grok/poll`, {
                method: "POST",
                body: JSON.stringify({ device_code: start.device_code }),
              });
            } catch (error) {
              if (!grokWaits[id]) return;
              grokWaits[id].message = error.message;
              grokWaits[id].error = true;
              paintGrokWait(id);
              return;
            }
            if (poll.status === "ok") {
              delete grokWaits[id];
              toast("Вход выполнен. Сессия обновится сама.");
              if (current === "upstreams") await go("upstreams");
              return;
            }
            if (poll.status === "error") {
              grokWaits[id].message = poll.message || "Вход не удался";
              grokWaits[id].error = true;
              paintGrokWait(id);
              toast(grokWaits[id].message, true);
              return;
            }
          }
          if (!grokWaits[id]) return;
          grokWaits[id].message = "Код истёк. Начните вход ещё раз.";
          grokWaits[id].error = true;
          paintGrokWait(id);
        });
      }

      function upstreamForm(up) {
        const edit = !!up;
        up = up || { id: "", label: "", kind: "openai_compatible", base_url: "", api_version: "v1beta", reasoning_dialect: "auto", grok: false };
        const kindValue = up.grok ? "grok" : up.kind || "openai_compatible";
        openDrawer({ title: edit ? `Провайдер «${up.label || up.id}»` : "Новый провайдер", sub: edit ? up.id : "Куда слать запросы: адрес API и его диалект" });
        drawerBody(`
          <div class="d-sec">
            <h3>Кто это</h3>
            <div class="form-grid">
              <label class="field"><span>ID</span><input id="f-id" value="${esc(up.id)}" placeholder="grok" ${edit ? "disabled" : ""} /><small>Латиницей, навсегда</small></label>
              <label class="field"><span>Название</span><input id="f-label" value="${esc(up.label)}" placeholder="Grok" /></label>
            </div>
          </div>
          <div class="d-sec">
            <h3>Как с ним говорить</h3>
            <div class="form-grid">
              <label class="field"><span>Протокол</span><select id="f-kind">
                <option value="openai_compatible" ${kindValue === "openai_compatible" ? "selected" : ""}>OpenAI-совместимый</option>
                <option value="gemini" ${kindValue === "gemini" ? "selected" : ""}>Gemini</option>
                <option value="grok" ${kindValue === "grok" ? "selected" : ""}>Подписка Grok</option></select></label>
              <label class="field"><span>Диалект рассуждений</span><select id="f-dialect">
                ${["auto", "openai", "openrouter", "qwen", "nvidia"].map((d) => `<option ${up.reasoning_dialect === d ? "selected" : ""}>${d}</option>`).join("")}
              </select><small>auto — определяется по адресу</small></label>
              <label class="field full"><span>Адрес API</span><input id="f-url" value="${esc(up.grok ? GROK_BASE : up.base_url)}" placeholder="https://openrouter.ai/api/v1" /></label>
              <label class="field"><span>Версия API (Gemini)</span><input id="f-ver" value="${esc(up.api_version || "v1beta")}" placeholder="v1beta" /></label>
            </div>
            <p class="hint hidden" id="f-grok-note">Это подписка Grok, не ключ с console.x.ai. Адрес фиксирован. После сохранения на карточке провайдера — вход через браузер: код подтверждения и ссылка. Модель назначается в разделе «Модели», как у остальных.</p>
          </div>`);
        drawerFoot(`<button class="btn" id="f-cancel">Отмена</button><button class="btn primary" id="f-save">${edit ? "Сохранить" : "Добавить"}</button>`);
        const applyKind = () => {
          const grok = $("f-kind").value === "grok";
          $("f-url").disabled = grok;
          $("f-grok-note").classList.toggle("hidden", !grok);
          if (grok) {
            $("f-url").value = GROK_BASE;
            if (!$("f-label").value.trim()) $("f-label").value = "Grok";
          } else if ($("f-url").value.trim() === GROK_BASE) {
            $("f-url").value = "";
          }
        };
        $("f-kind").onchange = applyKind;
        applyKind();
        $("f-cancel").onclick = closeDrawer;
        $("f-save").onclick = () => {
          const id = $("f-id").value.trim();
          if (!id) return toast("Нужен ID", true);
          const grok = $("f-kind").value === "grok";
          act($("f-save"), () =>
            call("/admin/upstreams", {
              method: "POST",
              body: JSON.stringify({
                ...up,
                id,
                label: $("f-label").value.trim(),
                kind: grok ? "openai_compatible" : $("f-kind").value,
                grok,
                base_url: grok ? GROK_BASE : $("f-url").value.trim(),
                api_version: $("f-ver").value.trim() || (grok ? "v1" : "v1beta"),
                reasoning_dialect: $("f-dialect").value,
                extra_headers: up.extra_headers || [],
                enabled: edit ? up.enabled : true,
                position: up.position || 0,
              }),
            }),
          ).then((r) => {
            if (r === undefined) return;
            toast(edit ? "Сохранено" : grok ? "Провайдер добавлен — войдите через браузер" : "Провайдер добавлен — теперь добавьте ему ключ");
            closeDrawer();
            go("upstreams");
          });
        };
      }

      // ============================================================ models
      let modelCache = [];
      let modelFilter = { kind: "all", q: "" };

      function roleOf(m) {
        return m.voice ? "voice" : m.vision ? "vision" : "chat";
      }
      function routingMode(r) {
        if (r && r.order && r.order.length) return "manual";
        return (r && r.sort) || "";
      }
      function routingBadge(r) {
        const mode = routingMode(r);
        if (!mode) return "";
        const text = mode === "price" ? "дешёвые хосты" : mode === "throughput" ? "быстрые хосты" : `хосты вручную · ${r.order.length}`;
        return `<span class="badge violet">${icon("route", 12)}${text}</span>`;
      }

      async function renderModels(page) {
        setHead(page, `<button class="btn primary" id="m-new">${icon("plus")}Добавить модель</button>`);
        $("m-new").onclick = () => modelForm();

        models.forEach((m) => counts[roleOf(m)]++);
        view(`
          <div class="toolbar">
            <div class="seg" id="m-kind">
              ${[["all", "Все"], ["chat", "Чат"], ["vision", "Изображения"], ["voice", "Голос"]]
                .map(([k, t]) => `<button data-kind="${k}" class="${modelFilter.kind === k ? "on" : ""}">${t} <span class="faint">${counts[k]}</span></button>`)
                .join("")}
