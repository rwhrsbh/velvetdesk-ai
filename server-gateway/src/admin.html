          <div class="callout" style="margin-bottom:16px">${icon("info", 18)}<div>
            Карточка выше — приоритетнее: её можно перетащить или подвинуть кнопками. Число «Порядок» в форме — тот же список. Запрос идёт в модель, что назвал клиент, а при сбое — дальше по списку.
            «Только голос» и «только изображения» — служебные: в чате не отвечают и не подменяют упавшую модель.
            Модели без зрения получают вместо фото подробное описание от модели «только изображения».</div></div>
          <div class="list stagger" id="m-list"></div>`);
        $("m-kind").onclick = (e) => {
          const b = e.target.closest("[data-kind]");
          if (!b) return;
          modelFilter.kind = b.dataset.kind;
          document.querySelectorAll("#m-kind button").forEach((x) => x.classList.toggle("on", x === b));
          drawModelList();
        };
        $("m-q").oninput = (e) => {
          modelFilter.q = e.target.value;
          drawModelList();
        };
        drawModelList();
      }

      function drawModelList() {
        const q = modelFilter.q.trim().toLowerCase();
        const list = modelCache.filter(
          (m) =>
            (modelFilter.kind === "all" || roleOf(m) === modelFilter.kind) &&
            (!q || [m.name, m.upstream_id, m.upstream_name].some((f) => String(f || "").toLowerCase().includes(q))),
        );
        const box = $("m-list");
        if (!list.length) {
          box.innerHTML = `<div class="empty">${icon("models", 30)}<div>${modelCache.length ? "Ничего не найдено" : "Моделей пока нет"}</div></div>`;
          return;
        }
        const upLabel = (id) => (upstreamCache.find((u) => u.id === id) || {}).label || id;
        box.innerHTML = list
          .map((m, i) => {
            const role = roleOf(m);
            const roleBadge =
              role === "voice"
                ? `<span class="badge blue">${icon("mic", 12)}только голос</span>`
                : role === "vision"
                  ? `<span class="badge violet">${icon("image", 12)}только изображения</span>`
                  : m.images
                    ? `<span class="badge green">${icon("eye", 12)}видит фото</span>`
                    : `<span class="badge amber">${icon("image", 12)}фото → описание</span>`;
            const chips = [
              ["вход", price(m.price_in)],
              ["кеш", m.price_cached == null ? "как вход" : price(m.price_cached)],
              ["выход", price(m.price_out)],
              ...(m.price_request ? [["клип", usd(m.price_request, 4)]] : []),
              ...(m.context_tokens ? [["контекст", Math.round(m.context_tokens / 1000) + "k"]] : []),
              ["приоритет", String(rank + 1)],
            ];
            const rank = modelCache.findIndex((row) => row.name === m.name);
            return `<div class="card item ${m.enabled ? "" : "off"}" data-m-name="${esc(m.name)}" style="--i:${Math.min(i, 12)}">
              <div style="min-width:0">
                <div class="i-title"><b class="ell">${esc(m.name)}</b>${roleBadge}${routingBadge(m.routing)}${m.enabled ? "" : '<span class="badge red">выключена</span>'}</div>
                <div class="i-sub"><span>${esc(upLabel(m.upstream_id))}</span><span class="sep">·</span><span class="mono ell">${esc(m.upstream_name || m.name)}</span></div>
                <div class="chips">${chips.map(([k, v]) => `<span class="chip"><i>${k}</i><b>${v}</b></span>`).join("")}
                  ${role === "chat" ? `<label class="switch-row" style="margin-left:6px"><button class="switch sm ${m.images ? "on" : ""}" data-m-img="${esc(m.name)}" role="switch" aria-checked="${!!m.images}" title="понимает ли модель картинки сама"></button>видит фото</label>` : ""}
                </div>
              </div>
              <div class="i-right">
                <span class="move">
                  <button class="btn icon sm ghost drag" draggable="true" data-m-drag="${esc(m.name)}" title="перетащить — выше приоритетнее">${icon("grip", 15)}</button>
                  <button class="btn icon sm ghost" data-m-up="${esc(m.name)}" title="выше, приоритетнее" ${i === 0 ? "disabled" : ""}>${icon("up", 15)}</button>
                  <button class="btn icon sm ghost" data-m-down="${esc(m.name)}" title="ниже" ${i === list.length - 1 ? "disabled" : ""}>${icon("down", 15)}</button>
                </span>
                ${role === "voice" ? "" : `<button class="btn sm" data-m-route="${esc(m.name)}">${icon("route")}Хосты</button>`}
                <button class="btn icon sm ghost" data-m-edit="${esc(m.name)}" title="изменить">${icon("edit")}</button>
                <button class="btn icon sm ghost danger" data-m-del="${esc(m.name)}" title="удалить">${icon("trash")}</button>
                <button class="switch ${m.enabled ? "on" : ""}" data-m-on="${esc(m.name)}" role="switch" aria-checked="${m.enabled}" title="${m.enabled ? "включена" : "выключена"}"></button>
              </div>
            </div>`;
          })
          .join("");
        [...box.children].forEach((c, i) => c.style.setProperty("--i", Math.min(i, 12)));

        const find = (name) => modelCache.find((m) => m.name === name);
        const save = (b, row, ok) =>
          act(b, () => call("/admin/models", { method: "POST", body: JSON.stringify(row) }), ok).then(async () => {
            modelCache = await call("/admin/models");
            drawModelList();
          });
        box.querySelectorAll("[data-m-on]").forEach((b) => {
          b.onclick = () => {
            const m = find(b.dataset.mOn);
            b.classList.toggle("on");
            save(b, { ...m, enabled: !m.enabled }, m.enabled ? "Модель выключена" : "Модель включена");
          };
        });
        box.querySelectorAll("[data-m-img]").forEach((b) => {
          b.onclick = () => {
            const m = find(b.dataset.mImg);
            b.classList.toggle("on");
            save(b, { ...m, images: !m.images }, m.images ? "Фото будут описываться" : "Фото уходят модели как есть");
          };
        });
        box.querySelectorAll("[data-m-edit]").forEach((b) => (b.onclick = () => modelForm(find(b.dataset.mEdit))));
        box.querySelectorAll("[data-m-route]").forEach((b) => (b.onclick = () => openRouting(b.dataset.mRoute)));
        box.querySelectorAll("[data-m-del]").forEach((b) => {
          b.onclick = async () => {
            const name = b.dataset.mDel;
            if (!(await confirmBox({ title: `Удалить модель «${name}»?`, text: "Клиенты, выбравшие её, пойдут по цепочке падения." }))) return;
            act(b, () => call(`/admin/models/${encodeURIComponent(name)}`, { method: "DELETE" }), "Модель удалена").then(() => go("models"));
          };
        });
        const visibleNames = () => list.map((row) => row.name);
        const placeVisible = (nextVisible) => {
          const shown = new Set(list.map((row) => row.name));
          const gaps = [];
          modelCache.forEach((row, index) => {
            if (shown.has(row.name)) gaps.push(index);
          });
          const next = modelCache.map((row) => row.name);
          nextVisible.forEach((name, index) => {
            next[gaps[index]] = name;
          });
          return next;
        };
        const commitOrder = (nextVisible, button) => {
          const names = placeVisible(nextVisible);
          act(button, () => call("/admin/models/order", { method: "POST", body: JSON.stringify({ names }) }), "Порядок сохранён").then(async (saved) => {
            if (saved === undefined) return;
            modelCache = await call("/admin/models");
            drawModelList();
          });
        };
        box.querySelectorAll("[data-m-up]").forEach((b) => {
          b.onclick = () => {
            const names = visibleNames();
            const index = names.indexOf(b.dataset.mUp);
            if (index <= 0) return;
            [names[index - 1], names[index]] = [names[index], names[index - 1]];
            commitOrder(names, b);
          };
        });
        box.querySelectorAll("[data-m-down]").forEach((b) => {
          b.onclick = () => {
            const names = visibleNames();
            const index = names.indexOf(b.dataset.mDown);
            if (index < 0 || index === names.length - 1) return;
            [names[index + 1], names[index]] = [names[index], names[index + 1]];
            commitOrder(names, b);
          };
        });
        let dragName = "";
        box.querySelectorAll("[data-m-drag]").forEach((handle) => {
          handle.addEventListener("dragstart", (event) => {
            dragName = handle.dataset.mDrag;
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", dragName);
            handle.closest(".item").classList.add("dragging");
          });
          handle.addEventListener("dragend", () => {
            dragName = "";
            box.querySelectorAll(".item").forEach((card) => card.classList.remove("dragging", "drop-above"));
          });
        });
        box.querySelectorAll(".item").forEach((card) => {
          card.addEventListener("dragover", (event) => {
            if (!dragName || card.dataset.mName === dragName) return;
            event.preventDefault();
            box.querySelectorAll(".item").forEach((other) => other.classList.remove("drop-above"));
            card.classList.add("drop-above");
          });
          card.addEventListener("drop", (event) => {
            event.preventDefault();
            const before = card.dataset.mName;
            if (!dragName || dragName === before) return;
            const names = visibleNames().filter((name) => name !== dragName);
            const at = names.indexOf(before);
            names.splice(at < 0 ? names.length : at, 0, dragName);
            commitOrder(names, null);
          });
        });
      }

      function modelForm(m) {
        const edit = !!m;
        m = m || { name: "", upstream_id: upstreamCache[0]?.id || "", upstream_name: "", price_in: "", price_cached: null, price_out: "", context_tokens: null, position: modelCache.length, voice: false, vision: false, images: false, price_request: 0, enabled: true };
        let role = roleOf(m);
        let catalogue = [];
        openDrawer({ title: edit ? `Модель «${m.name}»` : "Новая модель", sub: edit ? "Имя модели не меняется — это её адрес для клиентов" : "Выберите из каталога провайдера — имя и цены подставятся сами" });
        drawerBody(`
          <div class="d-sec">
            <h3>Откуда</h3>
            <div class="form-grid">
              <label class="field full"><span>Провайдер</span><select id="f-up">${upstreamCache
                .map((u) => `<option value="${esc(u.id)}" ${u.id === m.upstream_id ? "selected" : ""}>${esc(u.label || u.id)}</option>`)
                .join("")}</select></label>
            </div>
            <div class="catalog">
              <div class="search">${icon("search")}<input id="f-cat-q" placeholder="Каталог провайдера: нажмите «Загрузить», потом ищите" disabled /></div>
              <div class="cat-list" id="f-cat"><div class="dim" style="padding:14px 13px">Каталог не загружен.
                <button class="btn sm" id="f-cat-load" style="margin-left:8px">${icon("refresh")}Загрузить</button></div></div>
            </div>
          </div>
          <div class="d-sec">
            <h3>Как называется</h3>
            <div class="form-grid">
              <label class="field"><span>Имя для клиентов</span><input id="f-name" value="${esc(m.name)}" placeholder="glm-flash" ${edit ? "disabled" : ""} /></label>
              <label class="field"><span>Имя у провайдера</span><input id="f-uname" value="${esc(m.upstream_name)}" placeholder="z-ai/glm-5.3-flash" /><small>Пусто — такое же, как для клиентов</small></label>
            </div>
          </div>
          <div class="d-sec">
            <h3>Что умеет</h3>
            <div class="choice" id="f-role">
              <button data-role="chat" class="${role === "chat" ? "on" : ""}"><b>${icon("chat", 14)} Чат</b><span>Отвечает клиентам, участвует в цепочке падения</span></button>
              <button data-role="vision" class="${role === "vision" ? "on" : ""}"><b>${icon("image", 14)} Только изображения</b><span>Описывает фото для моделей без зрения</span></button>
              <button data-role="voice" class="${role === "voice" ? "on" : ""}"><b>${icon("mic", 14)} Только голос</b><span>Расшифровывает диктовку</span></button>
            </div>
            <label class="switch-row" id="f-img-row"><button class="switch ${m.images ? "on" : ""}" id="f-img" type="button" role="switch"></button>Видит фото сама — иначе фото заменяются описанием</label>
          </div>
          <div class="d-sec">
            <h3>Цены, $ за 1M токенов</h3>
            <div class="form-grid three">
              <label class="field"><span>Вход</span><input id="f-in" value="${m.price_in ?? ""}" inputmode="decimal" placeholder="0.15" /></label>
              <label class="field"><span>Кеш</span><input id="f-cached" value="${m.price_cached ?? ""}" inputmode="decimal" placeholder="как вход" /></label>
              <label class="field"><span>Выход</span><input id="f-out" value="${m.price_out ?? ""}" inputmode="decimal" placeholder="0.60" /></label>
              <label class="field"><span>Контекст, токенов</span><input id="f-ctx" value="${m.context_tokens ?? ""}" inputmode="numeric" placeholder="128000" /></label>
              <label class="field"><span>Порядок</span><input id="f-pos" value="${m.position ?? 0}" inputmode="numeric" /><small>Меньше — выше в списке. Карточки можно двигать и без этого числа.</small></label>
              <label class="field" id="f-req-row"><span>Цена за клип, $</span><input id="f-req" value="${m.price_request || ""}" inputmode="decimal" placeholder="0.002" /></label>
            </div>
            <p class="hint">Для OpenRouter списывается фактическая стоимость ответа; эти цены — запасные и для обзора.</p>
          </div>`);
        drawerFoot(`<button class="btn" id="f-cancel">Отмена</button><button class="btn primary" id="f-save">${edit ? "Сохранить" : "Добавить модель"}</button>`);

        const syncRole = () => {
          document.querySelectorAll("#f-role button").forEach((b) => b.classList.toggle("on", b.dataset.role === role));
          $("f-img-row").classList.toggle("hidden", role !== "chat");
          $("f-req-row").classList.toggle("hidden", role !== "voice");
        };
        syncRole();
        $("f-role").onclick = (e) => {
          const b = e.target.closest("[data-role]");
          if (b) {
            role = b.dataset.role;
            syncRole();
          }
        };
        $("f-img").onclick = () => $("f-img").classList.toggle("on");

        const drawCatalog = () => {
          const q = $("f-cat-q").value.trim().toLowerCase();
          const hits = catalogue.filter((c) => !q || (c.id + " " + (c.label || "")).toLowerCase().includes(q)).slice(0, 150);
          $("f-cat").innerHTML = hits.length
            ? hits
                .map((c) => `<button class="cat-item" data-cat="${esc(c.id)}"><span style="min-width:0"><span class="ell" style="display:block">${esc(c.label || c.id)}</span><span class="mono ell" style="display:block">${esc(c.id)}</span></span>
                  <span class="row" style="gap:6px">${c.images ? `<span class="badge green">${icon("eye", 12)}</span>` : ""}${c.price_in != null ? `<span class="chip"><b>${price(c.price_in)}</b><i>/</i><b>${price(c.price_out)}</b></span>` : ""}</span></button>`)
                .join("")
            : '<div class="dim" style="padding:14px 13px">Ничего не найдено</div>';
        };
        const loadCatalog = () =>
          act($("f-cat-load"), async () => {
            const data = await call(`/admin/upstreams/${encodeURIComponent($("f-up").value)}/catalog`);
            catalogue = data.models || [];
            $("f-cat-q").disabled = false;
            $("f-cat-q").placeholder = `Поиск среди ${catalogue.length} моделей`;
            $("f-cat-q").focus();
            drawCatalog();
          });
        $("f-cat-load").onclick = loadCatalog;
        $("f-up").onchange = () => {
          catalogue = [];
          $("f-cat-q").disabled = true;
          $("f-cat").innerHTML = `<div class="dim" style="padding:14px 13px">Каталог не загружен. <button class="btn sm" id="f-cat-load" style="margin-left:8px">${icon("refresh")}Загрузить</button></div>`;
          $("f-cat-load").onclick = loadCatalog;
        };
        $("f-cat-q").oninput = drawCatalog;
        $("f-cat").addEventListener("click", (e) => {
          const b = e.target.closest("[data-cat]");
          if (!b) return;
          const c = catalogue.find((x) => x.id === b.dataset.cat);
          document.querySelectorAll(".cat-item").forEach((x) => x.classList.toggle("on", x === b));
          const short = c.id.includes("/") ? c.id.split("/").pop() : c.id;
          if (!edit) $("f-name").value = short;
          $("f-uname").value = c.id === short ? "" : c.id;
          $("f-in").value = c.price_in ?? "";
          $("f-cached").value = c.price_cached ?? "";
          $("f-out").value = c.price_out ?? "";
          $("f-ctx").value = c.context_tokens ?? "";
          $("f-img").classList.toggle("on", !!c.images);
          if (c.audio && !c.chat) role = "voice";
          syncRole();
          toast(`Подставлено: ${c.id}`);
        });

        $("f-cancel").onclick = closeDrawer;
        $("f-save").onclick = () => {
          const name = $("f-name").value.trim();
          if (!name) return toast("Нужно имя модели", true);
          const row = {
            ...m,
            name,
            upstream_id: $("f-up").value,
            upstream_name: $("f-uname").value.trim(),
            price_in: num($("f-in").value),
            price_cached: maybe($("f-cached").value),
            price_out: num($("f-out").value),
            context_tokens: maybe($("f-ctx").value),
            position: num($("f-pos").value),
            voice: role === "voice",
            vision: role === "vision",
            images: role === "vision" ? true : role === "chat" ? $("f-img").classList.contains("on") : false,
            price_request: role === "voice" ? num($("f-req").value) : 0,
            enabled: edit ? m.enabled : true,
          };
          // Routing is kept by the server when it is not sent.
          delete row.routing;
          act($("f-save"), () => call("/admin/models", { method: "POST", body: JSON.stringify(row) })).then((r) => {
            if (r === undefined) return;
            toast(edit ? "Сохранено" : "Модель добавлена");
            closeDrawer();
            go("models");
          });
        };
      }

      // ------------------------------------------------ OpenRouter hosts
      const ROUTING_MODES = [
        ["", "Как решит OpenRouter", "Баланс цены и скорости"],
        ["price", "Самый дешёвый", "Сначала дешёвый, при сбое — следующий по цене"],
        ["throughput", "Самый быстрый", "По токенам в секунду за 30 минут"],
        ["manual", "Выбрать вручную", "Отмеченные по порядку, дальше — выбор OpenRouter"],
      ];
      function tps(v) {
        if (v == null) return null;
        if (typeof v === "number") return v;
        return v.p50 ?? v.median ?? v.avg ?? null;
      }
      const cost = (h) => (h.price_in ?? 1e9) + (h.price_out ?? 1e9);

      async function openRouting(name) {
        openDrawer({ title: `Хосты · ${name}`, sub: "Через кого OpenRouter обслуживает эту модель", wide: true });
        try {
          const [d, models] = await Promise.all([call(`/admin/models/${encodeURIComponent(name)}/providers`), call("/admin/models")]);
          const st = {
            model: models.find((x) => x.name === name),
            slug: d.model,
            target: d.target,
            hosts: d.hosts || [],
            mode: routingMode(d.routing),
            picked: [...((d.routing && d.routing.order) || [])],
            setPrice: true,
          };
          paintRouting(st);
        } catch (error) {
          drawerBody(`<div class="empty">${icon("info", 30)}<div>${esc(error.message)}</div></div>`);
        }
      }

      function orderedHosts(st) {
        const hosts = [...st.hosts];
        if (st.mode === "throughput") return hosts.sort((a, b) => (tps(b.throughput) ?? -1) - (tps(a.throughput) ?? -1));
        hosts.sort((a, b) => cost(a) - cost(b));
        if (st.mode === "manual") {
          const at = (h) => {
            const i = st.picked.indexOf(h.tag);
            return i < 0 ? 1e6 : i;
          };
          hosts.sort((a, b) => at(a) - at(b));
        }
        return hosts;
      }

      function paintRouting(st) {
        const hosts = orderedHosts(st);
        const manual = st.mode === "manual";
        const first = manual ? hosts.find((h) => st.picked.includes(h.tag)) : st.mode ? hosts[0] : null;
        const m = st.model || {};
        drawerBody(`
          <div class="callout">${icon("info", 18)}<div>Модель на OpenRouter: <span class="mono">${esc(st.slug)}</span>${
            st.target && st.target !== st.slug ? ` → сейчас это <span class="mono">${esc(st.target)}</span>` : ""
          }. Списывается фактическая стоимость ответившего хоста. Если выбранные недоступны — запрос уходит туда, куда выбрал бы OpenRouter.</div></div>
          <div class="d-sec">
            <h3>Режим</h3>
            <div class="choice four" id="r-modes">${ROUTING_MODES.map(
              ([id, t, h]) => `<button data-mode="${id}" class="${st.mode === id ? "on" : ""}"><b>${t}</b><span>${h}</span></button>`,
            ).join("")}</div>
          </div>
          <div class="d-sec">
            <h3>Хосты — ${hosts.length}</h3>
            ${hosts.length ? `<div class="table-wrap"><table class="hosts"><thead><tr>
              ${manual ? "<th></th>" : ""}<th>Хост</th><th>Вход</th><th>Кеш</th><th>Выход</th><th>Контекст</th><th>Ток/с</th><th>Аптайм</th><th></th>${manual ? "<th></th>" : ""}
            </tr></thead><tbody>${hosts
              .map((h) => {
                const picked = st.picked.includes(h.tag);
                const speed = tps(h.throughput);
                const down = h.status != null && h.status < 0;
                return `<tr class="${manual && picked ? "picked" : ""} ${first && first.tag === h.tag ? "first" : ""}">
                  ${manual ? `<td><input type="checkbox" data-pick="${esc(h.tag)}" ${picked ? "checked" : ""} /></td>` : ""}
                  <td><div class="row" style="gap:6px"><b style="font-weight:600">${esc(h.provider)}</b>${h.discount ? `<span class="badge green">−${Math.round(h.discount * 100)}%</span>` : ""}</div><div class="mono faint" style="font-size:11px">${esc(h.tag)}</div></td>
                  <td>${price(h.price_in)}</td><td>${price(h.price_cached)}</td><td>${price(h.price_out)}</td>
                  <td>${h.context ? Math.round(h.context / 1000) + "k" : "—"}</td>
                  <td>${speed == null ? '<span class="faint">—</span>' : Math.round(speed)}</td>
                  <td>${h.uptime == null ? '<span class="faint">—</span>' : `<span style="color:${h.uptime > 98 ? "var(--ok)" : h.uptime > 93 ? "var(--warn)" : "var(--bad)"}">${(+h.uptime).toFixed(1)}%</span>`}</td>
                  <td><div class="row" style="gap:5px">${down ? '<span class="badge red">сбоит</span>' : ""}${h.tools ? "" : '<span class="badge amber" title="агенту не подходит">без tools</span>'}</div></td>
                  ${manual ? `<td>${picked ? `<div class="row" style="gap:4px"><button class="btn icon sm ghost" data-up="${esc(h.tag)}">${icon("up", 15)}</button><button class="btn icon sm ghost" data-down="${esc(h.tag)}">${icon("down", 15)}</button></div>` : ""}</td>` : ""}
                </tr>`;
              })
              .join("")}</tbody></table></div>` : '<div class="empty">OpenRouter не вернул ни одного хоста для этой модели.</div>'}
            <p class="hint">Зелёная полоса — хост, куда запрос пойдёт первым. «Без tools» — хост не вызывает инструменты, агенту не подходит.</p>
          </div>
          <div class="d-sec">
            <h3>Цены в таблице</h3>
            <label class="switch-row"><button class="switch ${st.setPrice && first ? "on" : ""}" id="r-price" type="button" ${first ? "" : "disabled"}></button>
              ${first ? `Взять цены <b style="color:var(--text)">${esc(first.provider)}</b> — ${price(first.price_in)} / ${price(first.price_out)} (сейчас ${price(m.price_in)} / ${price(m.price_out)})` : "Выберите режим, чтобы подставить цены первого хоста"}</label>
          </div>`);
        drawerFoot(`<button class="btn" id="r-cancel">Отмена</button><button class="btn primary" id="r-save">Сохранить</button>`);

        $("r-modes").onclick = (e) => {
          const b = e.target.closest("[data-mode]");
          if (!b) return;
          st.mode = b.dataset.mode;
          if (st.mode === "manual" && !st.picked.length) {
            st.picked = orderedHosts({ ...st, mode: "price" })
              .filter((h) => h.status == null || h.status >= 0)
              .slice(0, 3)
              .map((h) => h.tag);
          }
          paintRouting(st);
        };
        document.querySelectorAll("[data-pick]").forEach((box) => {
          box.onchange = () => {
            const tag = box.dataset.pick;
            st.picked = box.checked ? [...st.picked, tag] : st.picked.filter((t) => t !== tag);
            paintRouting(st);
          };
        });
        const move = (tag, by) => {
          const i = st.picked.indexOf(tag);
          const j = i + by;
          if (i < 0 || j < 0 || j >= st.picked.length) return;
          [st.picked[i], st.picked[j]] = [st.picked[j], st.picked[i]];
          paintRouting(st);
        };
        document.querySelectorAll("[data-up]").forEach((b) => (b.onclick = () => move(b.dataset.up, -1)));
        document.querySelectorAll("[data-down]").forEach((b) => (b.onclick = () => move(b.dataset.down, 1)));

          if (first && st.setPrice) {
            if (first.price_in != null) row.price_in = first.price_in;

      // ============================================================ licences
      let licenseRows = [];
      let licFilter = { q: "", state: "all" };

      async function renderLicenses(page) {
        setHead(page, `<button class="btn primary" id="l-new">${icon("plus")}Выдать лицензию</button>`);
        $("l-new").onclick = () => licenseForm();
        licenseRows = await call("/admin/licenses");
        view(`
          <div class="toolbar">
            <div class="seg" id="l-state">${[["all", "Все"], ["active", "Активные"], ["expired", "Истекли"], ["revoked", "Отозваны"]]

              .join("")}</div>

      function licState(r) {
        if (r.revoked) return "revoked";
        if (r.expires_at && r.expires_at * 1000 < Date.now()) return "expired";
        return "active";
      }

      function drawLicenseList() {
        const q = licFilter.q.trim().toLowerCase();
        const rows = licenseRows.filter(
          (r) =>
            (licFilter.state === "all" || licState(r) === licFilter.state) &&
            (!q || [r.license_id, r.tier, r.note].some((f) => String(f || "").toLowerCase().includes(q))),
        );
        const box = $("l-list");
        if (!rows.length) {
          box.innerHTML = `<div class="empty">${icon("licenses", 30)}<div>${licenseRows.length ? "Ничего не найдено" : "Пока ни одной лицензии"}</div></div>`;
          return;
        }
        box.innerHTML = rows
          .map((r, i) => {
            const s = licState(r);
            const days = r.expires_at ? Math.ceil((r.expires_at * 1000 - Date.now()) / 86400000) : null;
            const status =
              s === "revoked"
                ? '<span class="badge red"><span class="dot"></span>отозвана</span>'
                : s === "expired"
                  ? '<span class="badge amber"><span class="dot"></span>истекла</span>'
                  : '<span class="badge green"><span class="dot"></span>активна</span>';
            return `<div class="card item clickable" data-open="${esc(r.license_id)}" style="--i:${Math.min(i, 12)};animation:rise .4s var(--ease) both;animation-delay:${Math.min(i, 12) * 35}ms">
              <div class="row" style="gap:14px;min-width:0">
                <div class="avatar" style="background:linear-gradient(135deg,#43306f,#2c2440)">${icon("key", 18)}</div>
                <div style="min-width:0">
                  <div class="i-title"><b class="mono ell" style="font-size:13.5px">${esc(r.license_id)}</b><span class="badge violet">${esc(r.tier)}</span>${status}</div>
                  <div class="i-sub"><span>${r.note ? esc(r.note) : '<span class="faint">без пометки</span>'}</span><span class="sep">·</span>
                    <span>${r.expires_at ? (s === "active" ? `ещё ${days} дн. · до ${dt(r.expires_at)}` : `до ${dt(r.expires_at)}`) : "без срока"}</span><span class="sep">·</span><span>${r.max_peers} устр.</span></div>
                </div>
              </div>
              <div class="i-right faint">${icon("chev", 18)}</div>
            </div>`;
          })
          .join("");
        box.querySelectorAll("[data-open]").forEach((c) => (c.onclick = () => openLicense(c.dataset.open)));

      function licenseForm() {
        openDrawer({ title: "Новая лицензия", sub: "Ключ покажется один раз — сразу отдайте его клиенту" });
        drawerBody(`<div class="d-sec"><div class="form-grid">
            <label class="field full"><span>ID лицензии</span><input id="f-lid" placeholder="VD-PRO-0001" /><small>Пусто — сгенерируется</small></label>

      function secretBox(text, title) {
        return `<div class="secret" style="animation:rise .35s var(--ease) both"><div class="callout warn" style="padding:10px 12px">${icon("info", 16)}<div>${esc(title)}</div></div>
          <code>${esc(text)}</code><div><button class="btn sm" id="copy-secret">${icon("copy")}Скопировать</button></div></div>`;

      function bindCopy(text) {

      async function openLicense(id) {
        openDrawer({ title: id, sub: "Лицензия" });

          drawerBody(`<div class="empty">${icon("info", 30)}<div>${esc(error.message)}</div></div>`);

      function gauge(label, left, cap, cls, sub) {
        const pct = cap > 0 ? Math.max(0, Math.min(100, (left / cap) * 100)) : 0;
        return `<div class="gauge ${cls || ""}"><div class="g-l">${label}</div>
          <div class="g-v">${fmt(Math.round(left))}${cap > 0 ? ` <small>из ${fmt(Math.round(cap))}</small>` : ""}</div>
          ${cls === "wallet" ? "" : `<div class="meter ${pct < 15 ? "bad" : pct < 40 ? "warn" : "ok"}"><i style="width:${pct}%"></i></div>`}
          <div class="g-s">${sub}</div></div>`;
      }

      function chart(daily, days = 30) {
        if (!daily.length) return '<div class="dim">Расхода за период не было</div>';
        const w = 640, h = 130, pad = 2;
        // One slot per day of the window: days without spend stay empty
        // rather than one busy day stretching across the whole chart.
        const today = Math.floor(Date.now() / 86400000) * 86400;
        const byDay = new Map(daily.map((d) => [Math.floor(d.day / 86400) * 86400, d]));
        const slots = Array.from({ length: days }, (_, i) => {
          const day = today - (days - 1 - i) * 86400;
          return byDay.get(day) || { day, credits: 0, calls: 0 };
        });
        const max = Math.max(...slots.map((d) => d.credits), 1);
        const bw = (w - pad * 2) / slots.length;
        const bars = slots
          .map((d, i) => {
            if (!d.credits) return `<rect x="${pad + i * bw + 1.5}" y="${h - 2}" width="${Math.max(1, bw - 3)}" height="2" rx="1" fill="rgb(255 255 255 / .08)"><title>${dt(d.day)}: без расхода</title></rect>`;
            const bh = Math.max(3, (d.credits / max) * (h - 16));
            return `<rect x="${pad + i * bw + 1.5}" y="${h - bh}" width="${Math.max(1, bw - 3)}" height="${bh}" rx="3" fill="url(#g)">
              <title>${dt(d.day)}: ${Math.round(d.credits)} кред. · ${d.calls} запр.</title></rect>`;
          })
          .join("");
        return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff6fb5"/><stop offset="1" stop-color="#a979ff"/></linearGradient></defs>${bars}</svg>`;
      }

      async function paintLicense(id) {
        const d = await call(`/admin/licenses/${encodeURIComponent(id)}/detail`);
        const row = d.license || {};
        const money = (c) => usd(c * (d.credit_usd || 0));
        const spent = (d.daily || []).reduce((s, x) => s + x.credits, 0);
        const calls = (d.daily || []).reduce((s, x) => s + x.calls, 0);
        const s = licState(row);
        $("d-sub").textContent = `${row.tier || ""} · ${row.expires_at ? "до " + dt(row.expires_at) : "без срока"}${row.note ? " · " + row.note : ""}`;
        drawerBody(`
          <div class="row" style="gap:8px;flex-wrap:wrap">
            <span class="badge violet">${esc(row.tier || "")}</span>
            ${s === "revoked" ? '<span class="badge red"><span class="dot"></span>отозвана</span>' : s === "expired" ? '<span class="badge amber"><span class="dot"></span>истекла</span>' : '<span class="badge green"><span class="dot"></span>активна</span>'}
            <span class="badge">${row.expires_at ? "до " + dt(row.expires_at) : "без срока"}</span>
          </div>
          <div class="d-sec">
            <h3>Кредиты</h3>
            <div class="gauges">
              ${gauge("За 5 часов", d.allowance.left_5h, d.tier.credits_5h, "", "окно обновляется каждые 5 ч")}
              ${gauge("За неделю", d.allowance.left_week, d.tier.credits_week, "", "окно обновляется раз в неделю")}
              ${gauge("Кошелёк", d.allowance.wallet, 0, "wallet", "докупленные, не сгорают")}
            </div>
            <p class="hint">${d.allowance.reset_at ? `Исчерпанное окно откроется ${dtime(d.allowance.reset_at)}.` : "Окна не исчерпаны."} Кошелёк тратится, только когда тарифные закончились.</p>
            <div class="row"><input id="d-credits" placeholder="Кредитов в кошелёк (минус — списать)" inputmode="numeric" style="max-width:300px" />
              <button class="btn" id="d-add-credits">${icon("plus")}В кошелёк</button></div>
          </div>
          <div class="d-sec">
            <h3>Расход по дням · ${d.days} дн.</h3>
            <div class="card card-pad" style="background:rgb(0 0 0 / .25)">${chart(d.daily || [], d.days || 30)}</div>
            <div class="gauges">
              <div class="gauge"><div class="g-l">Кредитов</div><div class="g-v">${fmt(Math.round(spent))}</div></div>
              <div class="gauge"><div class="g-l">Себестоимость</div><div class="g-v">${money(spent)}</div></div>
              <div class="gauge"><div class="g-l">Запросов</div><div class="g-v">${fmt(calls)}</div></div>
            </div>
          </div>
          <div class="d-sec">
            <h3>Устройства · ${(d.devices || []).length} из ${row.max_peers}</h3>
            <div class="row"><input id="d-peers" value="${row.max_peers}" inputmode="numeric" style="width:90px" /><button class="btn" id="d-save-peers">Изменить лимит мест</button></div>
            <div class="devices">${(d.devices || []).length
              ? d.devices
                  .map((dev) => `<div class="device"><div style="min-width:0"><span class="mono ell" style="display:block">${esc(dev.device_id)}</span>
                    <small>впервые ${dtime(dev.first_seen)} · последний раз ${dtime(dev.last_seen)}</small></div>
                    <button class="btn sm danger" data-free="${esc(dev.device_id)}">Отвязать</button></div>`)
                  .join("")
              : '<div class="dim">Ни одного устройства ещё не заходило</div>'}</div>
          </div>
          <div class="d-sec">
            <h3>Ключ</h3>
            <p class="hint">Сам ключ показывается один раз и не хранится. Потерял — перевыпусти: вернётся ровно тот же ключ.</p>
            <div><button class="btn" id="d-reissue">${icon("key")}Показать / перевыпустить</button></div>
            <div id="d-key-out"></div>
          </div>`);
        drawerFoot(`<button class="btn" id="d-mailbox">Очистить обмен</button><span style="flex:1"></span>
          <button class="btn ${row.revoked ? "primary" : "danger"}" id="d-revoke">${row.revoked ? "Вернуть ключ" : "Отозвать ключ"}</button>`);

        $("d-reissue").onclick = () =>
          act($("d-reissue"), () => call(`/admin/licenses/${encodeURIComponent(id)}/reissue`, { method: "POST" })).then((out) => {
            if (!out) return;
            $("d-key-out").innerHTML = secretBox(out.license, "Отдайте клиенту и попросите сохранить");
            bindCopy(out.license);
          });
        $("d-add-credits").onclick = () => {
          const typed = $("d-credits").value.trim();
          if (!typed) return $("d-credits").focus();
          act($("d-add-credits"), () =>
            call(`/admin/licenses/${encodeURIComponent(id)}/credits`, { method: "POST", body: JSON.stringify({ credits: num(typed) }) }),
          ).then((out) => {
            if (!out) return;
            toast(`Кошелёк: ${Math.round(out.credits_left)} кред.`);
            paintLicense(id);
          });
        };
        $("d-save-peers").onclick = () =>
          act($("d-save-peers"), () =>
            call(`/admin/licenses/${encodeURIComponent(id)}/peers`, { method: "POST", body: JSON.stringify({ max_peers: num($("d-peers").value) }) }),
          ).then((r) => {
            if (r === undefined) return;
            toast("Лимит мест сохранён");
            paintLicense(id);
          });
        document.querySelectorAll("[data-free]").forEach((b) => {
          b.onclick = async () => {
            if (!(await confirmBox({ title: "Отвязать устройство?", text: "Место освободится; устройство сможет зайти снова, если есть свободные места.", ok: "Отвязать" }))) return;
            act(b, () => call(`/admin/licenses/${encodeURIComponent(id)}/devices/${encodeURIComponent(b.dataset.free)}`, { method: "DELETE" }), "Устройство отвязано").then(() => paintLicense(id));
          };
        });
        $("d-mailbox").onclick = async () => {
          if (!(await confirmBox({ title: "Очистить обмен?", text: "Удалятся зашифрованные записи синхронизации этой лицензии на сервере. На устройствах данные останутся.", ok: "Очистить" }))) return;
          act($("d-mailbox"), () => call(`/admin/licenses/${encodeURIComponent(id)}/mailbox`, { method: "DELETE" })).then((out) => out && toast(`Очищено записей: ${out.cleared}`));
        };
        $("d-revoke").onclick = async () => {
          if (!row.revoked && !(await confirmBox({ title: "Отозвать ключ?", text: "Клиент сразу потеряет доступ к облаку. Вернуть можно в любой момент.", ok: "Отозвать" }))) return;
          act($("d-revoke"), () =>
            call(row.revoked ? "/admin/unrevoke" : "/admin/revoke", { method: "POST", body: JSON.stringify({ license_id: id, reason: "admin" }) }),
          ).then(async (r) => {
            if (r === undefined) return;
            toast(row.revoked ? "Ключ возвращён" : "Ключ отозван");
            if (current === "licenses") {
              licenseRows = await call("/admin/licenses");
              drawLicenseList();
            }
            paintLicense(id);
          });
        };
      }

      // ============================================================ stats
      let statHours = 24;

      async function renderStats(page) {
        setHead(page, periodSeg("s-seg", statHours));
        $("s-seg").onclick = (e) => {
          const b = e.target.closest("[data-h]");
          if (!b) return;
          statHours = Number(b.dataset.h);
          go("stats");
        };
        const data = await call(`/admin/stats?hours=${statHours}`);
        const money = (c) => usd(c * data.credit_usd, 2);
        const total = data.by_license.reduce((a, r) => a + r.credits, 0);
        const calls = data.by_license.reduce((a, r) => a + r.calls, 0);
        const byL = [...data.by_license].sort((a, b) => b.credits - a.credits);
        const byM = [...data.by_model].sort((a, b) => b.credits - a.credits);
        const maxL = Math.max(1, ...byL.map((r) => r.credits));
        const maxM = Math.max(1, ...byM.map((r) => r.credits));
        const kpi = (ic, label, val, sub) => `<div class="card kpi"><div class="k-label">${icon(ic, 15)}${label}</div><div class="k-val">${val}</div><div class="k-sub">${sub}</div></div>`;
        view(`
          <div class="kpis stagger">
            ${kpi("coin", "Себестоимость", money(total), fmt(total) + " кредитов")}
            ${kpi("chat", "Запросов", fmt(calls), calls ? "≈ " + usd((total * data.credit_usd) / calls, 4) + " за запрос" : "—")}
            ${kpi("users", "Лицензий с расходом", byL.length, "за выбранный период")}
            ${kpi("activity", "Попадание в кеш", (data.cache_share * 100).toFixed(1) + "%", "входных токенов из кеша провайдера")}
          </div>
          <div class="two" style="margin-top:14px">
            <div class="card card-pad"><div class="section-title" style="margin:0 0 14px">По лицензиям</div>
              ${byL.length ? `<div class="bars stagger">${byL
                .map((r) => `<div class="bar-row clickable" data-open-lic="${esc(r.license_id)}"><span class="b-name mono ell">${esc(r.license_id)}</span>
                  <span class="b-val">${money(r.credits)} · ${fmt(r.calls)} запр.</span><div class="meter ok"><i style="width:${(r.credits / maxL) * 100}%"></i></div></div>`)
                .join("")}</div>` : '<div class="dim">Тихо</div>'}</div>
            <div class="card card-pad"><div class="section-title" style="margin:0 0 14px">По моделям</div>
              ${byM.length ? `<div class="bars stagger">${byM
                .map((r) => `<div class="bar-row"><span class="b-name mono ell">${esc(r.model)}</span>
                  <span class="b-val">${money(r.credits)} · кеш ${(r.cache_share * 100).toFixed(0)}%</span><div class="meter"><i style="width:${(r.credits / maxM) * 100}%"></i></div></div>`)
                .join("")}</div>` : '<div class="dim">Тихо</div>'}</div>
          </div>`);
        document.querySelectorAll("[data-open-lic]").forEach((el) => (el.onclick = () => openLicense(el.dataset.openLic)));
      }

      // ============================================================ boot
      const RENDER = {
        overview: renderOverview,
        upstreams: renderUpstreams,
        models: renderModels,
        tiers: renderTiers,
        licenses: renderLicenses,
        stats: renderStats,
      };

      if (!token) showLogin();
      else {
        go(current);
        refreshLive();
      }
    </script>
  </body>
</html>
