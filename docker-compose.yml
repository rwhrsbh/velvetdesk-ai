# The gateway, start to finish:
#
#   docker compose up -d --build
#
# One service, one volume. The database, the config and anything else the
# gateway writes live in ./gateway-data on the host, so moving the whole
# service to another machine is: stop it, copy that folder, start it there.
#
# Before the first start, set VD_ADMIN_TOKEN — without it the admin page is
# closed rather than open, and there is no way in to add providers or keys.
services:
  gateway:
    build:
      context: .
      dockerfile: server-gateway/Dockerfile
    image: velvetdesk/gateway:latest
    container_name: velvetdesk-gateway
    restart: unless-stopped
    environment:
      # Inside the container there is nothing else on the network namespace,
      # so listening on every interface is the isolation the port mapping
      # below controls.
      VD_BIND: 0.0.0.0:8787
      VD_DB_PATH: /data/gateway.db
      VD_GATEWAY_CONFIG: /data/gateway.json
      # The key licences are checked against: the public half that
      # `velvetdesk-gateway keygen` prints. Without it every request is
      # refused, which is the safe way round.
      VD_LICENSE_PUBLIC_KEY: ${VD_LICENSE_PUBLIC_KEY:-}
      # The admin page's password. Empty closes the page entirely.
      VD_ADMIN_TOKEN: ${VD_ADMIN_TOKEN:-}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      # Loopback only: the caddy service below is what faces the internet.
      # Change to "8787:8787" to expose the gateway directly — that is plain
      # HTTP, so only do it behind a firewall or for a local test.
      - "127.0.0.1:8787:8787"
    volumes:
      - ./gateway-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/velvetdesk-gateway", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # TLS, for a server that has an IP and no domain name.
  #
  #   cp server-gateway/Caddyfile.example Caddyfile   (put your address in)
  #   docker compose --profile tls up -d
  #
  # A free name from sslip.io points at your IP and lets Caddy get a real
  # certificate; see the comments in the Caddyfile. Without this the licence
  # key and every message travel in the clear.
  caddy:
    image: caddy:2
    container_name: velvetdesk-caddy
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
