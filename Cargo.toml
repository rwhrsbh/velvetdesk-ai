# The desktop, the gateway and the code they both need to talk to a model.
#
# `vd-llm` is that shared middle: the key pool, the provider shapes and the
# calls themselves. The client sends them from a laptop, the gateway from a
# VPS, and neither has its own copy to keep in step with the other.
[workspace]
members = ["crates/vd-license", "crates/vd-llm", "server-gateway", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.77.2"
license-file = "LICENSE"

[workspace.dependencies]
vd-llm = { path = "crates/vd-llm" }
vd-license = { path = "crates/vd-license" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "multipart", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
log = "0.4"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
